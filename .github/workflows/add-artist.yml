name: Add artist

# Run from the GitHub app: Actions → Add artist → Run workflow.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Artist or band name, as written on posters"
        required: true
      official_tour_url:
        description: "Official tour page, https://… (optional)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect # never at the same time as the daily collection
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Add to config/artists.yaml
        env:
          ARTIST_NAME: ${{ inputs.name }}
          OFFICIAL_TOUR_URL: ${{ inputs.official_tour_url }}
        run: python -m collector.add_artist

      - name: Collect concerts for this artist
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ARTIST_NAME: ${{ inputs.name }}
        run: python -m collector.main --artist "$ARTIST_NAME"

      - name: Send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m collector.notify_telegram

      - name: Save
        if: always()
        env:
          ARTIST_NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/artists.yaml docs/data
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "Add artist: $ARTIST_NAME"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

  publish:
    needs: add
    if: always()
    uses: ./.github/workflows/pages.yml
