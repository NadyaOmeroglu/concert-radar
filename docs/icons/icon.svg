<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A0F5C"/>
      <stop offset="0.55" stop-color="#7B1FA2"/>
      <stop offset="1" stop-color="#FF4F7B"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#FFB3E1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFB3E1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE3F0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#spot)"/>
  <!-- radar waves -->
  <g fill="none" stroke="#FFD36E" stroke-linecap="round" stroke-width="18">
    <path d="M150 170 a120 120 0 0 0 0 150" opacity="0.95"/>
    <path d="M362 170 a120 120 0 0 1 0 150" opacity="0.95"/>
    <path d="M112 136 a170 170 0 0 0 0 218" opacity="0.55"/>
    <path d="M400 136 a170 170 0 0 1 0 218" opacity="0.55"/>
  </g>
  <!-- microphone -->
  <rect x="206" y="130" width="100" height="160" rx="50" fill="url(#mic)"/>
  <g stroke="#7B1FA2" stroke-width="8" stroke-linecap="round" opacity="0.35">
    <line x1="226" y1="175" x2="286" y2="175"/>
    <line x1="222" y1="200" x2="290" y2="200"/>
    <line x1="226" y1="225" x2="286" y2="225"/>
  </g>
  <path d="M182 262 a74 74 0 0 0 148 0" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="336" x2="256" y2="380" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  <line x1="214" y1="384" x2="298" y2="384" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
</svg>
