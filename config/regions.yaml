# Где показывать концерты. Файл можно менять прямо на github.com.
# Коды стран — двухбуквенные (ISO 3166-1 alpha-2), например "FR" = Франция.
# ВАЖНО: каждый код пишите в кавычках. Без кавычек "NO" (Норвегия)
# прочитается как «нет».

# Страны Шенгенской зоны (29). Чтобы добавить страну (например, GB или CY),
# допишите её код в список extra_countries ниже.
schengen: ["AT", "BE", "BG", "HR", "CZ", "DK", "EE", "FI", "FR", "DE", "GR", "HU", "IS", "IT", "LV", "LI", "LT", "LU", "MT", "NL", "NO", "PL", "PT", "RO", "SK", "SI", "ES", "SE", "CH"]

# Дополнительные страны целиком (все города).
#   SA — Саудовская Аравия, OM — Оман
extra_countries: ["SA", "OM"]

# Страны, где показываем только отдельные города.
# Для каждого города можно указать варианты написания.
cities:
  "AE":   # ОАЭ
    - name: Dubai
      aliases: [Dubai, Dubayy]
    - name: Abu Dhabi
      aliases: [Abu Dhabi, Abu Zabi, Yas Island, Saadiyat Island]
